<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>الصفحة غير موجودة — AI for All</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1628;--navy2:#11263f;--green-l:#3ec98a;--gold:#f0c85a;--txt:#eef4fa;--muted:#b9c8d7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:radial-gradient(ellipse at 70% 110%,rgba(22,155,98,.2),transparent 55%),linear-gradient(180deg,var(--navy),var(--navy2));color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.wrap{max-width:520px}
svg{margin-bottom:24px}
h1{font-size:5rem;font-weight:800;color:var(--green-l);line-height:1}
h2{font-size:1.5rem;font-weight:700;margin:10px 0 8px}
p{color:var(--muted);margin-bottom:28px}
a.btn{display:inline-block;background:var(--green-l);color:var(--navy);font-weight:700;padding:13px 40px;border-radius:40px;text-decoration:none;transition:opacity .2s}
a.btn:hover{opacity:.9}
</style>
</head>
<body>
  <div class="wrap">
    <svg width="72" height="72" viewBox="30 25 115 120"><g stroke="#3ec98a" stroke-width="3" fill="none" opacity=".85"><line x1="85" y1="85" x2="85" y2="33"/><line x1="85" y1="85" x2="130" y2="59"/><line x1="85" y1="85" x2="130" y2="111"/><line x1="85" y1="85" x2="85" y2="137"/><line x1="85" y1="85" x2="40" y2="111"/><line x1="85" y1="85" x2="40" y2="59"/></g><g fill="#169b62"><circle cx="85" cy="85" r="14"/><circle cx="85" cy="33" r="8"/><circle cx="130" cy="59" r="8"/><circle cx="130" cy="111" r="8"/><circle cx="85" cy="137" r="8"/><circle cx="40" cy="111" r="8"/><circle cx="40" cy="59" r="8"/></g></svg>
    <h1>404</h1>
    <h2>الصفحة غير موجودة</h2>
    <p>يبدو أن الرابط الذي طلبته غير متاح. لا بأس — لنعُد إلى البداية.</p>
    <a class="btn" href="/">العودة إلى الصفحة الرئيسية</a>
  </div>
</body>
</html>
